[project]
name = "ttbotc-resolution-mod"
# Semantic versioning (https://semver.org), released from tags vX.Y.Z: see CONTRIBUTING.md.
version = "0.3.0"
description = "Widescreen mod for Tzar: The Burden of the Crown: the original game at 21:9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click==8.5.1",
    "pefile==2024.8.26",
]

[project.scripts]
tzar-widescreen = "tzar_widescreen.cli:main"

[project.urls]
Homepage = "https://github.com/bruno-gelb/ttbotc_resolution_mod"
Issues = "https://github.com/bruno-gelb/ttbotc_resolution_mod/issues"

# Every dependency is pinned to an exact version here, and with its whole tree in uv.lock.
[dependency-groups]
dev = [
    "capstone==5.0.9",      # src/tools: disassembly
    "pillow==13.0.0",       # viewing the game's bitmaps
    "pyinstaller==6.22.3",  # release builds
    "pytest==9.2.0",        # tests/
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tzar_widescreen"

[tool.pytest.ini_options]
testpaths = ["tests"]
