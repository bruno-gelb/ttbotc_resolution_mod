# Runs the test suite on every pull request and every push to main, on Linux and Windows. The tests build synthetic
# game files, so they need neither the game nor cnc-ddraw. Pinned like the release workflow.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"  # Python comes from .python-version, packages from uv.lock
      - name: Tests
        run: uv run --locked pytest
